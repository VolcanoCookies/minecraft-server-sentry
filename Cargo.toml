[workspace]
members = ["sentry", "protocol", "packet_macros", "packet", "client"]
default-members = ["sentry"]

[workspace.dependencies]
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tracing-tracy = { version = "0.11.4", features = ["enable", "flush-on-exit"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.26.0", features = ["macros", "rt-multi-thread"] }
